<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rapports – Urban Drip</title>
<style>
  :root { --noir:#111; --blanc:#fff; --vert:#14803c; --gris:#f4f4f4; --bord:#e6e6e6; }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Poppins', Arial, sans-serif; background:var(--blanc); color:var(--noir); line-height:1.5; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--bord); }
  .logo { font-weight:900; letter-spacing:2px; font-size:1.2rem; }
  .logo span { color:var(--vert); }
  .tag { font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:#555; }
  main { max-width:640px; margin:0 auto; padding:24px 18px 60px; }
  h2 { font-size:1.2rem; margin-bottom:14px; }
  h3 { font-size:.85rem; text-transform:uppercase; letter-spacing:1px; margin:28px 0 10px; }
  input { width:100%; padding:13px; border:1px solid #bbb; font-size:16px; font-family:inherit; margin-bottom:10px; }
  .btn { display:block; width:100%; padding:14px; background:var(--noir); color:#fff; border:2px solid var(--noir); font-family:inherit; font-weight:700; font-size:.85rem; text-transform:uppercase; cursor:pointer; margin-top:10px; }
  .btn:hover { background:var(--vert); border-color:var(--vert); }
  .btn.clair { background:#fff; color:var(--noir); }
  .btn.clair:hover { background:var(--noir); color:#fff; border-color:var(--noir); }
  .msg { font-size:.9rem; margin-top:12px; min-height:1.2em; color:#c0392b; }
  .periodes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .periodes button { padding:12px 6px; border:1px solid var(--noir); background:#fff; font-family:inherit; font-size:.8rem; font-weight:600; cursor:pointer; color:var(--noir); }
  .periodes button.actif { background:var(--noir); color:#fff; }
  .sous { font-size:.85rem; color:#555; margin:14px 0 4px; }
  .cartes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .carte { background:var(--gris); padding:14px 12px; min-width:0; }
  .carte .val { font-size:1.2rem; font-weight:800; overflow-wrap:anywhere; }
  .carte .lib { font-size:.72rem; color:#555; text-transform:uppercase; letter-spacing:.4px; }
  .carte .sous-c { font-size:.72rem; color:#666; margin-top:4px; }
  .liste { padding-left:20px; font-size:.9rem; }
  .liste li { margin-bottom:6px; overflow-wrap:anywhere; }
  .liste li.nul { color:#666; list-style:none; margin-left:-20px; }
  #recos { list-style:none; padding-left:0; }
  #recos li { background:var(--gris); padding:10px 12px; margin-bottom:8px; border-left:3px solid var(--vert); }
  #recos li.nul { background:none; border:none; color:#666; }
  .stock-bloc { margin-top:10px; }
  .graph { width:100%; height:auto; display:block; background:#fafafa; }
  .barre { display:grid; grid-template-columns:minmax(0,40%) minmax(0,1fr) auto; gap:8px; align-items:center; margin-bottom:8px; font-size:.8rem; }
  .barre-lib { overflow-wrap:anywhere; }
  .barre-piste { background:var(--gris); height:14px; }
  .barre-fill { background:var(--noir); height:100%; }
  .barre-val { font-weight:600; white-space:nowrap; }
  #attente { padding-left:0; list-style:none; }
  .attente-item { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; background:var(--gris); padding:12px; margin-bottom:8px; font-size:.85rem; }
  .btn.petit { width:auto; padding:10px 14px; margin-top:0; font-size:.75rem; }
  @media (max-width:360px) { .cartes { grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <span class="logo">URBAN<span>DRIP</span></span>
  <span class="tag">Rapports</span>
</header>

<main>
  <section id="connexion" hidden>
    <h2>Connexion administrateur</h2>
    <input type="email" id="ad-email" placeholder="E-mail" autocomplete="email">
    <input type="password" id="ad-mdp" placeholder="Mot de passe" autocomplete="current-password">
    <button class="btn" id="ad-entrer">Se connecter</button>
    <p class="msg" id="ad-msg"></p>
  </section>

  <section id="tableau" hidden>
    <h2>Rapports</h2>
    <div class="periodes">
      <button data-periode="semaine" class="actif">Cette semaine</button>
      <button data-periode="semaine_passee">Semaine passée</button>
      <button data-periode="mois">Ce mois</button>
      <button data-periode="mois_passe">Mois passé</button>
    </div>
    <p class="sous" id="periode-txt"></p>
    <p class="msg" id="ad-msg2"></p>

    <h3>Vue d'ensemble</h3>
    <div class="cartes" id="indicateurs"></div>

    <h3>Évolution du chiffre d'affaires</h3>
    <div id="graph-jours"></div>

    <h3>Paiements à confirmer</h3>
    <ul class="liste" id="attente"></ul>

    <h3>Recommandations</h3>
    <ul class="liste" id="recos"></ul>

    <h3>Commandes par statut</h3>
    <div id="statuts"></div>

    <h3>Articles les plus vendus (chiffre d'affaires)</h3>
    <div id="top"></div>

    <h3>Dépenses</h3>
    <ul class="liste" id="depenses"></ul>

    <h3>Stock</h3>
    <div class="cartes" id="stock"></div>
    <ul class="liste stock-bloc" id="alertes"></ul>

    <h3>Clients</h3>
    <div class="cartes" id="clients"></div>

    <button class="btn" id="partager">Envoyer ce rapport sur WhatsApp</button>
    <button class="btn clair" id="deco">Se déconnecter</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var db = null;
  try {
    if (typeof SUPABASE_URL === 'string' && SUPABASE_URL.indexOf('http') === 0) {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch (e) { db = null; }

  var F = function (n) { return Math.round(Number(n) || 0).toLocaleString('fr-FR') + ' FCFA'; };
  var D = function (d) { return d.toLocaleDateString('fr-FR'); };
  var STATUTS = {
    en_attente: 'En attente de paiement', payee: 'Payées', confirmee: 'Confirmées',
    en_preparation: 'En préparation', expediee: 'Expédiées', livree: 'Livrées',
    annulee: 'Annulées', remboursee: 'Remboursées'
  };
  var CATEG = { publicite: 'Publicité', livraison: 'Livraison', emballage: 'Emballage', paiement: 'Frais de paiement', autre: 'Autres' };
  var periode = 'semaine';
  var dernier = null;

  function bornes(p) {
    var now = new Date(), j = 86400000;
    var debutMois = function (d) { return new Date(d.getFullYear(), d.getMonth(), 1); };
    if (p === 'semaine') { return { debut: new Date(now - 7 * j), fin: now, titre: 'Les 7 derniers jours' }; }
    if (p === 'semaine_passee') { return { debut: new Date(now - 14 * j), fin: new Date(now - 7 * j), titre: 'La semaine précédente' }; }
    if (p === 'mois') { return { debut: debutMois(now), fin: now, titre: 'Ce mois-ci' }; }
    var fm = debutMois(now);
    return { debut: new Date(fm.getFullYear(), fm.getMonth() - 1, 1), fin: fm, titre: 'Le mois dernier' };
  }

  // Période de même durée juste avant, pour comparer
  function precedent(b) {
    var duree = b.fin - b.debut;
    return { debut: new Date(b.debut - duree), fin: new Date(b.debut) };
  }

  async function appeler(b) {
    var r = await db.rpc('rapport', { debut: b.debut.toISOString(), fin: b.fin.toISOString() });
    if (r.error) { throw r.error; }
    return r.data;
  }

  function calc(d) {
    var brut = Number(d.ca_brut) || 0, remises = Number(d.remises) || 0;
    var net = brut - remises;
    var eligibles = Number(d.commandes_eligibles) || 0;
    var complet = (Number(d.lignes_sans_cout) || 0) === 0;
    var benefice = complet ? net - (Number(d.cout_achat) || 0) - (Number(d.depenses) || 0) : null;
    return {
      net: net,
      panier: eligibles ? Math.round(brut / eligibles) : 0,
      complet: complet,
      benefice: benefice,
      marge: (complet && net > 0) ? Math.round(benefice / net * 100) : null
    };
  }

  function evolution(a, b) {
    a = Number(a) || 0; b = Number(b) || 0;
    if (!b) { return a ? 'nouveau' : ''; }
    var p = Math.round((a - b) / b * 100);
    return (p > 0 ? '+' : '') + p + ' % vs précédente';
  }

  function recommandations(d, dp, c, cp) {
    var r = [];
    if (!(Number(d.commandes_eligibles) > 0)) {
      r.push('Aucune vente sur la période : partage ta boutique pour attirer tes premiers clients.');
    }
    if (Number(d.lignes_sans_cout) > 0) {
      r.push("Renseigne le coût d'achat de " + d.lignes_sans_cout + " article(s) pour obtenir un bénéfice réel.");
    }
    if (Number(d.statuts.en_attente) > 0) {
      r.push(d.statuts.en_attente + ' commande(s) attendent encore leur paiement : vérifie Wave et Orange Money.');
    }
    if ((d.stock_faible || []).length) {
      r.push('Réapprovisionner : ' + d.stock_faible.slice(0, 3).join(', ') + '.');
    }
    if (cp.net > 0 && c.net < cp.net * 0.8) {
      r.push("Chiffre d'affaires en baisse de plus de 20 % : une promotion ou une publication peut relancer les ventes.");
    }
    if (Number(d.remboursements) > 0) {
      r.push('Regarde les motifs de remboursement pour repérer un problème qui revient.');
    }
    return r.slice(0, 5);
  }

  function vider(el) { el.textContent = ''; return el; }

  function carte(parent, lib, val, sous) {
    var c = document.createElement('div'); c.className = 'carte';
    var v = document.createElement('div'); v.className = 'val'; v.textContent = val;
    var l = document.createElement('div'); l.className = 'lib'; l.textContent = lib;
    c.appendChild(v); c.appendChild(l);
    if (sous) { var s = document.createElement('div'); s.className = 'sous-c'; s.textContent = sous; c.appendChild(s); }
    parent.appendChild(c);
  }

  function liste(parent, items, vide) {
    if (!items.length) {
      var n = document.createElement('li'); n.className = 'nul'; n.textContent = vide; parent.appendChild(n); return;
    }
    items.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; parent.appendChild(li); });
  }

  function afficher(x) {
    var d = x.d, dp = x.dp, c = x.c, cp = x.cp, b = x.b;
    $('periode-txt').textContent = b.titre + ' · du ' + D(b.debut) + ' au ' + D(b.fin);
    graphiqueJours($('graph-jours'), x.jours || []);

    var ind = vider($('indicateurs'));
    carte(ind, "Chiffre d'affaires net", F(c.net), evolution(c.net, cp.net));
    carte(ind, 'Commandes confirmées ou payées', String(d.commandes_eligibles), evolution(d.commandes_eligibles, dp.commandes_eligibles));
    carte(ind, 'Panier moyen', F(c.panier), '');
    if (c.complet) {
      carte(ind, 'Bénéfice estimé', F(c.benefice), c.marge !== null ? 'Marge : ' + c.marge + ' %' : '');
    } else {
      carte(ind, 'Bénéfice estimé', 'Données insuffisantes', d.lignes_sans_cout + " article(s) sans coût d'achat");
    }
    carte(ind, 'Dépenses', F(d.depenses), '');
    carte(ind, 'Frais de livraison facturés', F(d.livraison_facturee), '');
    carte(ind, 'Remises accordées', F(d.remises), '');
    carte(ind, 'Remboursements', F(d.remboursements), (d.statuts.remboursee || 0) + ' commande(s)');

    liste(vider($('recos')), x.recos, 'Rien à signaler pour le moment.');

    barresH($('statuts'),
      Object.keys(STATUTS).filter(function (k) { return d.statuts[k]; })
        .map(function (k) { return { l: STATUTS[k], v: Number(d.statuts[k]) }; }),
      'Aucune commande sur la période.', String);

    barresH($('top'),
      (d.top_articles || []).map(function (a) { return { l: a.nom + ' · ' + a.quantite + ' vendu(s)', v: Number(a.ca) || 0 }; }),
      'Aucune vente sur la période.', F);

    var cats = d.depenses_par_categorie || {};
    liste(vider($('depenses')),
      Object.keys(cats).map(function (k) { return (CATEG[k] || k) + ' : ' + F(cats[k]); }),
      'Aucune dépense enregistrée.');

    carte(vider($('stock')), 'Valeur du stock', F(d.stock_valeur), "Au coût d'achat");
    liste(vider($('alertes')),
      (d.stock_faible || []).map(function (n) { return 'Stock faible : ' + n; }),
      'Aucune alerte de stock.');

    var cl = vider($('clients'));
    carte(cl, 'Nouveaux comptes', String(d.nouveaux_comptes), evolution(d.nouveaux_comptes, dp.nouveaux_comptes));
    carte(cl, 'Profils complétés', String(d.profils_completes), '');
    carte(cl, 'Inscriptions newsletter', String(d.abonnes_newsletter), '');
    carte(cl, 'Demandes de retour', String(d.retours), '');
  }

  async function lancer(p) {
    periode = p;
    document.querySelectorAll('[data-periode]').forEach(function (x) {
      x.classList.toggle('actif', x.getAttribute('data-periode') === p);
    });
    $('ad-msg2').textContent = '';
    var b = bornes(p), avant = precedent(b);
    try {
      var r = await Promise.all([appeler(b), appeler(avant), ventesJours(b)]);
      var c = calc(r[0]), cp = calc(r[1]);
      dernier = { d: r[0], dp: r[1], jours: r[2], b: b, c: c, cp: cp, recos: recommandations(r[0], r[1], c, cp) };
      afficher(dernier);
      await chargerAttente();
    } catch (e) {
      var m = (e && e.message) ? e.message : '';
      $('ad-msg2').textContent = /acces refuse/i.test(m)
        ? "Accès refusé : ce compte n'est pas administrateur."
        : 'Impossible de charger le rapport : ' + m;
    }
  }

  async function ventesJours(b) {
    var r = await db.rpc('ventes_par_jour', { debut: b.debut.toISOString(), fin: b.fin.toISOString() });
    if (r.error) { throw r.error; }
    return r.data || [];
  }

  function barresH(parent, items, vide, format) {
    vider(parent);
    if (!items.length) { liste(parent, [], vide); return; }
    var max = Math.max.apply(null, items.map(function (i) { return i.v; })) || 1;
    items.forEach(function (i) {
      var row = document.createElement('div'); row.className = 'barre';
      var lab = document.createElement('div'); lab.className = 'barre-lib'; lab.textContent = i.l;
      var piste = document.createElement('div'); piste.className = 'barre-piste';
      var fill = document.createElement('div'); fill.className = 'barre-fill';
      fill.style.width = Math.max(2, Math.round(i.v / max * 100)) + '%';
      piste.appendChild(fill);
      var val = document.createElement('div'); val.className = 'barre-val'; val.textContent = format(i.v);
      row.appendChild(lab); row.appendChild(piste); row.appendChild(val);
      parent.appendChild(row);
    });
  }

  function graphiqueJours(parent, jours) {
    vider(parent);
    if (!jours.length) { liste(parent, [], 'Aucune donnée sur la période.'); return; }
    var ns = 'http://www.w3.org/2000/svg';
    var W = 600, H = 180, pad = 8, gap = 4, n = jours.length;
    var max = Math.max.apply(null, jours.map(function (j) { return Number(j.ca) || 0; })) || 1;
    var bw = Math.max(3, (W - pad * 2 - gap * (n - 1)) / n);
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (H + 24));
    svg.setAttribute('class', 'graph');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', "Chiffre d'affaires par jour");
    jours.forEach(function (j, i) {
      var v = Number(j.ca) || 0;
      var h = Math.round(v / max * (H - 10));
      var x = pad + i * (bw + gap);
      var r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', H - h);
      r.setAttribute('width', bw); r.setAttribute('height', h);
      r.setAttribute('fill', v > 0 ? '#111' : '#ddd');
      var t = document.createElementNS(ns, 'title');
      t.textContent = D(new Date(j.jour)) + ' · ' + F(v) + ' · ' + j.commandes + ' commande(s)';
      r.appendChild(t);
      svg.appendChild(r);
      var pas = Math.ceil(n / 7);
      if (i % pas === 0) {
        var lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', x + bw / 2); lab.setAttribute('y', H + 16);
        lab.setAttribute('text-anchor', 'middle'); lab.setAttribute('font-size', '11');
        lab.textContent = new Date(j.jour).toLocaleDateString('fr-FR', { day: 'numeric', month: 'numeric' });
        svg.appendChild(lab);
      }
    });
    parent.appendChild(svg);
  }

  async function chargerAttente() {
    var zone = vider($('attente'));
    var r = await db.rpc('commandes_en_attente');
    if (r.error) { $('ad-msg2').textContent = 'Paiements : ' + r.error.message; return; }
    if (!r.data.length) { liste(zone, [], 'Aucun paiement à confirmer.'); return; }
    r.data.forEach(function (c) {
      var li = document.createElement('li'); li.className = 'attente-item';
      var t = document.createElement('span');
      t.textContent = 'Commande n°' + c.id + ' · ' + F(c.total) + ' · ' + c.telephone + ' · ' + D(new Date(c.cree_le));
      var b = document.createElement('button'); b.className = 'btn petit'; b.textContent = 'Marquer payée';
      b.addEventListener('click', async function () {
        b.disabled = true;
        var x = await db.rpc('marquer_payee', { p_id: c.id });
        if (x.error) { b.disabled = false; $('ad-msg2').textContent = 'Impossible : ' + x.error.message; return; }
        await lancer(periode);
      });
      li.appendChild(t); li.appendChild(b); zone.appendChild(li);
    });
  }

  function montrer(id) {
    ['connexion', 'tableau'].forEach(function (x) { $(x).hidden = (x !== id); });
  }

  async function charger() {
    if (!db) { $('ad-msg').textContent = "Le site n'est pas relié à Supabase."; montrer('connexion'); return; }
    var s = await db.auth.getSession();
    if (!s.data.session) { montrer('connexion'); return; }
    montrer('tableau');
    await lancer(periode);
  }

  $('ad-entrer').addEventListener('click', async function () {
    $('ad-msg').textContent = '';
    var r = await db.auth.signInWithPassword({ email: $('ad-email').value.trim(), password: $('ad-mdp').value });
    if (r.error) { $('ad-msg').textContent = 'E-mail ou mot de passe incorrect.'; return; }
    $('ad-mdp').value = '';
    charger();
  });

  document.querySelectorAll('[data-periode]').forEach(function (b) {
    b.addEventListener('click', function () { lancer(b.getAttribute('data-periode')); });
  });

  $('partager').addEventListener('click', function () {
    if (!dernier) { return; }
    var x = dernier, d = x.d;
    var l = [
      'Rapport Urban Drip · ' + x.b.titre,
      'Du ' + D(x.b.debut) + ' au ' + D(x.b.fin),
      '',
      "Chiffre d'affaires net : " + F(x.c.net),
      'Commandes confirmées ou payées : ' + d.commandes_eligibles,
      'Panier moyen : ' + F(x.c.panier),
      'Bénéfice estimé : ' + (x.c.complet ? F(x.c.benefice) : 'données insuffisantes'),
      'Dépenses : ' + F(d.depenses)
    ];
    if (x.recos.length) {
      l.push('', 'À faire :');
      x.recos.forEach(function (r) { l.push('- ' + r); });
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(l.join('\n')), '_blank');
  });

  $('deco').addEventListener('click', async function () {
    if (db) { await db.auth.signOut(); }
    dernier = null;
    montrer('connexion');
  });

  charger();
})();
</script>
</body>
</html>
